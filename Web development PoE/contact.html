<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Get in touch with Osizweni Science Center. Send us an iquiry about our programmes.">
        <title>Osizweni Science Centre | Contact Us</title>
        <link rel="stylesheet" href="CSS/style.css">
    </head>
    <body>
         
        <header>
            <h1>Osizweni Science Centre</h1>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About Us</a></li>
                    <li><a href="contact.html">Contact Us</a></li>
                    <li><a href="programmes.html">Programmes</a></li>
                    <li><a href="booking.html">Booking</a></li>
                    <li><a href="faq.html">FAQ</a></li>
                    <li><a href="gallery.html">Gallery</a></li>
                </ul>  
            </nav>
        </header>
        
        <main>
            <section class="hero">
                <h2>Get in Touch</h2>
                <p>Have questions about our programmes or want to visit us? Send Us a message below.</p>
            </section>

            <section style="padding: 2rem; max-width: 900px; margin: 0 4rem auto; background: #ffffff; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
                <form id="contactForm" style="display: flex; flex-direction: column; gap: 1rem;">
                    <div id="formMessage" style="font-weight: bold; margin-bottom: 0.5rem;"></div>

                    <div>
                        <label style="display: block; font-weight: bold; margin-bottom: 0.5rem;">Your Name</label>
                        <input type="text" id="name" placeholder="Enter your full name" required style="width: 100%; padding: 0.5rem;">
                    </div>

                    <div>
                        <label style="display: block; font-weight: bold; margin-bottom: 0.5rem;">Email Adress</label>
                        <input type="email" id="email" placeholder="Enter your email" required style="width: 100%; padding: 0.5rem;">
                    </div>

                    <div>
                        <label style="display: block; font-weight: bold; margin-bottom: 0.5rem;">Message</label>
                        <textarea id="message" rows="5" placeholder="Write your message here......." required style="width: 100%; padding: 0.5rem;"></textarea>
                    </div>

                    <button type="submit" style="background-color: #003366; color: #ffffff; border: none; padding: 0.75rem; cursor: pointer;">Send Message</button>
                </form>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 Osizweni Science Centre. All rights reserved.</p>
        </footer>
        
        <script>
            document.getElementById('contactForm').addEventListener('submit', function(e){
                e.preventDefault();

                const name = document.getElementById('name').value.trim();
                const email = document.getElementById('email').value.trim();
                const message = document.getElementById('message').value.trim();
                const msgDiv = document.getElementById('formMessage');

                if (!name || !email || !message){
                    msgDiv.style.color='red';
                    msgDiv.textContent = 'Please fill in all required deatils before submitting.';
                    return;
                }
                
                if (!email.includes('@') || !email.includes('.')){
                    msgDiv.style.color = 'red';
                    msgDiv.textContent = 'Please enter a valid email address.';
                    return;
                }

                msgDiv.style.color='green';
                msgDiv.textContent = 'Thank you! Your message has been received.';

                document.getElementById('contactForm').reset();
            });
        </script>
    </body>
</html>
