<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial scale=1.0">
        <title>Osizweni Science Centre | Booking</title>
        <link rel="stylesheet" href="CSS/style.css">
    </head>
    <body>

        <header>
            <h1>Osizweni Science Centre</h1>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About Us</a></li>
                    <li><a href="contact.html">Contact Us</a></li>
                    <li><a href="programmes.html">Programmes</a></li>
                    <li><a href="booking.html">Booking</a></li>
                    <li><a href="faq.html">FAQ</a></li>
                    <li><a href="gallery.html">Gallery</a></li>
                </ul>
            </nav>
        </header>
        <main>
            <section class="hero">
                <h2>Book a School Visit or Tour</h2>
                <p>Schedule your group or school excursion to experience interactive STEM exhibits and workshops.</p>
            </section>

            <section style="padding: 2rem; max-width: 900px; margin: 0 auto 4rem auto; background: #ffffff; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
                <form id="bookingForm" style="display: flex; flex-direction: column; gap: 1rem;">
                    <div id="bookingMessage" style="font-weight: bold; margin-bottom: 0.5rem;"></div>

                    <div>
                        <label style="display: block; font-weight: bold; margin-bottom: 105rem;">School / Organization Name</label>
                        <input type="text" id="bookName" placeholder="Enter school/Organization name" required style="width: 100%; padding: 0.8rem; border: 1px solid #ccc; border-radius: 4px;">
                    </div>

                    <div>
                        <label style="display: block; font-weight: bold; margin-bottom: 0.5rem;">Contact person Email</label>
                        <input type="email" id="bookemail" placeholder="Enter email address." required style="width: 100%; padding: 0.8rem; border: 1px solid #ccc; border-radius: 4px;">
                    </div>

                    <div>
                        <label style="display: block; font-weight: bold; margin-bottom: 0.5rem;">Preferred Visit Date</label>
                        <input type="date" id="bookDate" required style="width: 100%; padding: 0.8rem; border: 1px solid #ccc; border-radius: 4px;">
                    </div>

                    <div>
                        <label style="display: block; font-weight: bold; margin-bottom: 0.5rem;">Estimated Number of learners</label>
                        <input type="number" id="bookLearners" min="1" placeholder="e.g. 30" required style="width: 100%; padding: 0.8rem; border: 1px solid #ccc; border-radius: 4px;">
                    </div>
                    
                    <button type="submit" style="background-color: #003366; color: #ffffff; border: none; padding: 1rem; cursor: pointer; font-weight: bold; border-radius: 4px;">Submit Booking Request</button>
                </form>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 Osizweni Science Centre. All rights reserved.</p>
        </footer>

        <script>
            document.getElementById('bookingForm').addEventListener('submit', function(e){
                e.preventDefault ();

                const name = document.getElementById('bookName').value.trim();
                const email = document.getElementById('bookEmail').value.trim();
                const date = document.getElementById('bookDate').value;
                const learners = document.getElementById('bookLearners').value;
                const msgDiv = document.getElementById('bookingMessage');

                if (!name || !email || !date || !learners){
                    msgDiv.style.color = 'red';
                    msgDiv.textContent = 'Please fill inall the required booking details.';
                return;              
              }

              if (!email.includes('@') || !email.includes('.')){
                msgDiv.style.color = "red";
                msgDiv.textContent ='Please enter a valid email address.';
                return
              }
              msgDiv.style.color = 'green';
              msgDiv.textContent = 'Booking request received successfully! We will contact you shortyly.';

              document.getElementById('bookingForm').reset();
            });
        </script>

    </body>
</html>
